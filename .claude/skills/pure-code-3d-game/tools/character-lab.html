<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GameKit v3 · Character Lab</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f141b;color:#e8ecf3;font:14px system-ui}header{padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#19202c}button,select,input{border:1px solid #465267;border-radius:6px;background:#252e3c;color:inherit;padding:8px}label{display:flex;align-items:center;gap:5px}#stage{display:block;width:100%;height:calc(100dvh - 138px);min-height:340px;touch-action:none}#status{font:12px ui-monospace,monospace;padding:10px;min-height:35px}small{color:#aeb6c5}#gate{color:#ffc76b;font-weight:700}
</style></head><body><header><strong>Character Lab</strong><input type="file" id="file" accept=".json,application/json"><select id="view"><option value="three">3/4</option><option value="front">正面</option><option value="side">侧面</option><option value="back">背面</option></select><select id="lighting"><option value="studio">Studio</option><option value="flat">Flat</option></select><select id="pose"><option value="base">Bind Pose</option></select><label><input type="checkbox" id="wire">线框</label><button id="stats">保存几何统计</button><span id="gate">VISUAL_PENDING</span></header><canvas id="stage"></canvas><div id="status">请选择模型 JSON。此 Lab 仅负责几何可视化和数值统计，不能自动证明人物美观或动作真实。</div>
<script type="module">
const cv=document.querySelector('#stage'), status=document.querySelector('#status');const gl=cv.getContext('webgl2',{antialias:true});
if(!gl){status.textContent='WebGL2 unavailable; no visual gate can pass';throw Error('WebGL2 unavailable')}
const shader=(kind,src)=>{const s=gl.createShader(kind);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};
const vs=`#version 300 es
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;layout(location=2) in vec3 aColor;uniform mat4 uVP;out vec3 vN;out vec3 vC;void main(){vN=aNrm;vC=aColor;gl_Position=uVP*vec4(aPos,1.);}`;
const fs=`#version 300 es
precision highp float;in vec3 vN,vC;out vec4 o;uniform int uFlat;uniform vec3 uLight;void main(){vec3 n=normalize(vN);float d=max(dot(n,normalize(uLight)),0.);float shade=uFlat==1?0.76:(0.35+0.65*d);o=vec4(pow(max(vC*shade,vec3(0.001)),vec3(0.82)),1.);}`;
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
const attr=(i,n)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,n,gl.FLOAT,false,0,0);return b};
const vao=gl.createVertexArray();gl.bindVertexArray(vao);const pb=attr(0,3),nb=attr(1,3),cb=attr(2,3),ib=gl.createBuffer(),wireIb=gl.createBuffer();let wireCount=0;gl.bindVertexArray(null);
const U={vp:gl.getUniformLocation(prog,'uVP'),flat:gl.getUniformLocation(prog,'uFlat'),light:gl.getUniformLocation(prog,'uLight')};
const P=(fov,aspect,near,far)=>{const f=1/Math.tan(fov/2),a=new Float32Array(16);a[0]=f/aspect;a[5]=f;a[10]=(far+near)/(near-far);a[11]=-1;a[14]=2*far*near/(near-far);return a};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);const sub=(a,b)=>a.map((v,i)=>v-b[i]);const norm=a=>{let d=Math.hypot(...a)||1;return a.map(v=>v/d)};
const look=(eye,target)=>{let z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x),m=new Float32Array(16);m.set([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);return m};
const mul=(a,b)=>{let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o};
let model=null,vertexCount=0,indexCount=0,indices=null,yaw=-0.6,pitch=0.12,dist=3.6,target=[0,1,0],drag=null,drawn=false;
function buildNormals(v,ix){const n=new Float32Array(v.length);for(let j=0;j<ix.length;j+=3){const a=ix[j]*3,b=ix[j+1]*3,c=ix[j+2]*3,p=[v[a],v[a+1],v[a+2]],q=[v[b],v[b+1],v[b+2]],r=[v[c],v[c+1],v[c+2]],f=cross(sub(q,p),sub(r,p));for(const i of [a,b,c])for(let k=0;k<3;k++)n[i+k]+=f[k];}for(let j=0;j<n.length;j+=3){const a=norm([n[j],n[j+1],n[j+2]]);n.set(a,j)}return n}
function upload(m){const vertices=m.positions,inds=m.indices;if(!Array.isArray(vertices)||!Array.isArray(inds)||vertices.length%3||inds.length%3||vertices.length<9||inds.length<3)throw Error('positions & triangle indices required');if(vertices.some(x=>!Number.isFinite(x))||inds.some(i=>!Number.isInteger(i)||i<0||i>=vertices.length/3))throw Error('NaN or invalid triangle index');if(m.materialIds && (m.materialIds.length!==vertices.length/3 || m.materialIds.some(id=>!Number.isSafeInteger(id)||id<0)))throw Error('Invalid material IDs');
if(m.normals && (m.normals.length!==vertices.length || m.normals.some(x=>!Number.isFinite(x))))throw Error('Invalid normals');
drawn=false;model=m;indices=new Uint32Array(inds);vertexCount=vertices.length/3;indexCount=inds.length;
 const nrm=m.normals?.length===vertices.length?new Float32Array(m.normals):buildNormals(vertices,inds);const colors=new Float32Array(vertices.length),pal=[[0.48,0.60,0.76],[0.88,0.56,0.20],[0.18,0.28,0.35],[0.85,0.85,0.90],[0.24,0.70,0.60],[0.45,0.40,0.65]];for(let i=0;i<vertexCount;i++){const k=m.materialIds?.[i]||0;colors.set(pal[Math.abs(k)%pal.length],i*3)}
 gl.bindVertexArray(vao);for(const [b,v] of [[pb,new Float32Array(vertices)],[nb,nrm],[cb,colors]]){gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW)}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);const edges=new Set(),lines=[];for(let j=0;j<inds.length;j+=3){const a=inds[j],b=inds[j+1],c=inds[j+2];for(const [p,q] of [[a,b],[b,c],[c,a]]){const x=Math.min(p,q),y=Math.max(p,q),key=x+':'+y;if(!edges.has(key)){edges.add(key);lines.push(x,y)}}}wireCount=lines.length;gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,wireIb);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(lines),gl.STATIC_DRAW);gl.bindVertexArray(null);
 let minY=Infinity,maxY=-Infinity;for(let j=1;j<vertices.length;j+=3){minY=Math.min(minY,vertices[j]);maxY=Math.max(maxY,vertices[j])}target=[0,(minY+maxY)/2,0];dist=Math.max(2.2,(maxY-minY)*2.0);document.querySelector('#pose').replaceChildren(new Option('Bind Pose','base'),...Object.keys(m.poses||{}).map(name=>new Option(name,name)));status.textContent=`Mesh loaded: ${vertexCount} verts / ${indexCount/3} triangles; visual review is still pending`;
}
function render(){const dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.floor(cv.clientWidth*dpr)),h=Math.max(1,Math.floor(cv.clientHeight*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}gl.viewport(0,0,w,h);gl.clearColor(.063,.083,.118,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(model){const eye=[target[0]+dist*Math.sin(yaw)*Math.cos(pitch),target[1]+dist*Math.sin(pitch),target[2]+dist*Math.cos(yaw)*Math.cos(pitch)];gl.useProgram(prog);gl.uniformMatrix4fv(U.vp,false,mul(P(0.68,w/h,0.03,200),look(eye,target)));gl.uniform1i(U.flat,document.querySelector('#lighting').value==='flat'?1:0);gl.uniform3f(U.light,.6,.8,1);gl.enable(gl.DEPTH_TEST);gl.bindVertexArray(vao);const wire=document.querySelector('#wire').checked;gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,wire?wireIb:ib);gl.drawElements(wire?gl.LINES:gl.TRIANGLES,wire?wireCount:indexCount,gl.UNSIGNED_INT,0);gl.bindVertexArray(null);drawn=true}requestAnimationFrame(render)}
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('wheel',e=>{dist=Math.max(.5,Math.min(80,dist*Math.exp(e.deltaY*.001)));e.preventDefault()},{passive:false});
document.querySelector('#view').onchange=e=>{yaw={three:-Math.PI/4,front:0,side:Math.PI/2,back:Math.PI}[e.target.value];pitch=0};document.querySelector('#file').onchange=async e=>{try{upload(JSON.parse(await e.target.files[0].text()))}catch(err){status.textContent=err.message}};
document.querySelector('#pose').onchange=e=>{if(!model)return;const pos=e.target.value==='base'?model.positions:model.poses?.[e.target.value];if(pos?.length!==model.positions.length || pos.some(x=>!Number.isFinite(x))){status.textContent='Pose is missing/incompatible';return}gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,buildNormals(pos,indices),gl.STATIC_DRAW)};
document.querySelector('#stats').onclick=()=>{if(!model||!drawn){status.textContent='Load and render a model before exporting stats';return}let materials=new Set(model.materialIds||[0]);let data={generatedBy:'character-lab',recipeId:model.id||'unknown',generatorCommit:model.generatorCommit||'NOT_VERIFIED',vertices:vertexCount,triangles:indexCount/3,distinctMaterials:materials.size,invalidVertices:0,invalidBoneWeights:model.invalidBoneWeights??-1,invalidTransforms:model.invalidTransforms??-1,bodyPrimitiveBoxes:model.bodyPrimitiveBoxes??-1};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='geometry-stats.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.__characterLab={status:()=>({loaded:!!model,drawn,vertices:vertexCount,triangles:indexCount/3,webgl2:!!gl,visualAccepted:false}),load:upload,setView(v){document.querySelector('#view').value=v;document.querySelector('#view').dispatchEvent(new Event('change'))}};
render();
</script></body></html>
