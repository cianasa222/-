<style>

<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="wrap"><div id="game"></div><div id="hud3"></div><div id="fade"></div></div>
<script type="module">
import * as SEA from './sea.js';
import * as GAME from './game.js';

const wrap = document.getElementById('wrap'); SEA.renderer.domElement.id = 'gl'; wrap.prepend(SEA.renderer.domElement);

const hud = document.getElementById('hud3'), fade = document.getElementById('fade');

// "多年以后" — a game-style tag with a year counter racing during the time-lapse
const years = el('div', '', hud); years.className = 'pill'; years.style.cssText += 'left:36px;top:60px';
years.innerHTML = '<span style="width:12px;height:12px;border-radius:50%;background:#b9a6ff;display:inline-block"></span><span>多年以后</span><b id="yr" style="font:900 22px Noto Sans SC,sans-serif;color:#8a74e0">+1 年</b>';

const toast = el('div', '', hud); toast.className = 'pill'; toast.style.cssText += 'left:50%;top:70px;white-space:nowrap';

el('span', '', toast, '<b style="color:#ff6f9a">粉粉</b> 在这里留下了一朵小白花');
// the exit dialog
const modal = el('div', 'position:absolute;left:90px;top:470px;width:540px;padding:40px 36px 34px;border-radius:34px;background:rgba(255,251,246,.72);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);box-shadow:0 40px 80px -20px rgba(80,50,40,.35),0 0 0 1.5px rgba(255,255,255,.85) inset;text-align:center', hud);
sprite(GRID, 7, modal, 'display:block;margin:0 auto 18px');
el('div', "font:900 34px Noto Sans SC,sans-serif;color:#3a2b2a;letter-spacing:.04em", modal, '确定退出 地球 <span style="color:#ff9a5c">Online</span> 吗？');
el('div', "margin-top:12px;font:500 17px Noto Sans SC,sans-serif;color:#8a7a72;letter-spacing:.06em", modal, '你的存档，会被好好保存。');
const row = el('div', 'display:flex;gap:18px;margin-top:30px;justify-content:center', modal);

const quit = el('div', "position:relative;padding:16px 0;width:200px;border-radius:999px;background:#ff9a5c;font:600 20px Noto Sans SC,sans-serif;color:#fff;box-shadow:0 10px 24px rgba(255,140,80,.35);overflow:hidden", row, '退出');
const ripple = el('div', 'position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(255,255,255,.55)', quit);
// kinetic captions: one game-voice line per lyric line, every character pops in on the groove, the keyword lands on a beat
const CAP = [
  [0.116, 2.2, '今天，我下线啦', '下线', '#ff9a5c'],
  [2.322, 4.4, '躺在家附近的草地上', '草地', '#5cc9a0'],
  [4.528, 6.6, '这一生，好好过完了', '过完了', '#ff7fa5'],
  [6.734, 9.3, '把行李，一件件放下', '放下', '#9a86f0'],
  [9.474, 11.0, '推开窗，是海', '海', '#3fa9c9'],
  [11.122, 13.2, '后来，很多年过去了', '很多年', '#9a86f0'],
  [13.328, 15.4, '有人，来看我了', '看我', '#ff7fa5'],
  [15.511, 16.9, '那就，再见啦', '再见', '#ff9a5c'],

  const line = el('div', 'position:absolute;left:0;top:0;opacity:0;white-space:nowrap', capBox); const ki = txt.indexOf(key);

  const row = el('div', 'display:flex;align-items:flex-end', line);
  const chars = [...txt].map((ch, i) => { const isKey = i >= ki && i < ki + key.length;
    const w = el('div', `overflow:hidden;padding:0 1px 8px;margin-bottom:-8px;${ch === '，' ? 'width:34px' : ''}`, row);
    const sp = el('div', `font:900 60px/1.12 Noto Sans SC,sans-serif;letter-spacing:-.01em;color:${isKey ? col : '#2e2422'};will-change:transform`, w, ch === '，' ? '<span style="color:#c9b8ae">，</span>' : ch);
    return { sp, isKey, i }; });
  const under = el('div', `height:6px;border-radius:3px;background:${col};margin-top:12px;transform-origin:0 50%;width:${(ki + key.length) * 62}px;clip-path:inset(0 0 0 ${ki * 62}px)`, line);
  return { t0, t1, chars, line, ki, n: chars.length, tagIn, under }; });

function updateCaptions(t) {
  capBand.style.opacity = t < 10.3 ? 1 : .6;
  capLines.forEach(L => { const on = t >= L.t0 - .02 && t < L.t1 + .1; L.line.style.opacity = on ? 1 : 0; if (!on) return;
    const keyBeat = nextBeat(L.t0 + L.ki * .045), exitK = (i) => easeIn(range(t, L.t1 - .26 + i * .018, L.t1 - .06 + i * .018));

      const k = spring(t - ta, c.isKey ? SPR.toy : SPR.ui), out = exitK(c.i), pulse = c.isKey ? kick(t, 9) * .06 : 0;

}
// thanks for playing
const thanks = el('div', 'position:absolute;left:0;right:0;top:540px;text-align:center', fade);
thanks.innerHTML = `<div style="font:900 52px Noto Sans SC,sans-serif;color:#3a2b2a;letter-spacing:.2em">感谢游玩</div><div style="margin-top:16px;font:600 18px Noto Sans SC,sans-serif;color:#8a7a72;letter-spacing:.3em">地球 ONLINE</div>`;

window.renderAt = (t) => {
  const show3d = t > 9.0;
  SEA.renderer.domElement.style.visibility = show3d ? 'visible' : 'hidden';
  if (show3d) { SEA.update(t); SEA.render(); }
  GAME.update(t); updateCaptions(t);
  const kb = kick(t, 9);

  yr.textContent = '+' + Math.max(1, Math.round(1 + 36 * easeIn(range(t, 11.2, 12.9)))) + ' 年';

  const pr = t - 16.625; quit.style.transform = pr > 0 && pr < .25 ? `scale(${1 - .08 * Math.sin(Math.PI * pr / .25)})` : 'none';

window.__ready = true;
</script></body></html>
