<script type="module">

  i => ({ x: 70 + i * 58, y: 54 + Math.sin(i * 1.3) * 12, size: 54 }),
  i => ({ x: 70 + i * 62 + (i > 1 ? 22 : 0), y: 54 + Math.sin(i * 1.3) * 12, size: 54 }),

  const s = document.createElement('span'); s.textContent = ch; const l = LAY[li](0);
